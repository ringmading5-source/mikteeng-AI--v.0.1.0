[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mikteeng-rspm"
version = "0.2.0"
description = "Fixed-basis context-local learning with bounded multimodal memory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.scripts]
mikteeng-rspm = "mikteeng_rspm.cli:main"
mikteeng-ai = "mikteeng_rspm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

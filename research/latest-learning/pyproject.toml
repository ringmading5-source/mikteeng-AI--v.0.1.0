[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mikteeng-ai"
version = "0.1.0"
description = "Experimental character, word-role, sentence-state and passage prediction toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3"]

[project.optional-dependencies]
modalities = ["Pillow>=10"]

[project.scripts]
mikteeng-ai = "mikteeng_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

services:
  - type: web
    name: mikteeng-ai-chatbot
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: python -m mikteeng_rspm serve --host 0.0.0.0 --checkpoint models/synthetic_vector_demo.json
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
